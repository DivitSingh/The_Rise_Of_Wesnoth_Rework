#textdomain wesnoth-trow

#define TROW_DEATHS

    [event]
        name=last breath
        [filter]
            id=Prince Haldric
        [/filter]
        [message]
            speaker=unit
            message= _ "I cannot be finished yet... I still have so much more to do."
            image=portraits/haldric-surprised.webp
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Lady Jessene
        [/filter]
        [message]
            speaker=unit
            # wmllint: local spelling easil
            message= _ "No! I’ll not go so easil—"
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Lady Outlaw
        [/filter]
        [message]
            speaker=unit
            message= _ "Bah! I’m not dying today! <i>Poof</i>!"
        [/message]
		[message]
            speaker=narrator
            message= _ "<i>The Lady Outlaw vanishes in a puff of smoke.</i>"
            image=wesnoth-icon.png
        [/message]
        [set_variable]
            name=have_lady
            value=0
        [/set_variable]
        [store_unit]
            [filter]
                id=Lady Outlaw
            [/filter]
            variable=lady_store
            kill=yes
        [/store_unit]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Tromas
        [/filter]
        [message]
            speaker=unit
            message= _ "Hail the Kings, may their bloodlines continue beyond my time!"
        [/message]
        [message]
            speaker=King Eldaric IV
            message= _ "Tromas, this cannot be, it is too soon for you to die!"
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "Tromas was among father's most trusted men, he will be sorely missed."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Burin the Lost
        [/filter]
        [message]
            speaker=unit
            message= _ "Fool of a boy. I never should have followed him."
            image=portraits/burin-annoyed.webp
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Minister Edren
        [/filter]
        [message]
            speaker=unit
            message= _ "May the Lords of Light protect us all."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Sir Ladoc
        [/filter]
        [message]
            speaker=unit
            message= _ "For Land and Lord, I sacrifice all!"
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Crelanu
        [/filter]
        [message]
            speaker=unit
            message= _ "This cannot be the end, there is much I must do! You are on your own now Haldric, remember to heed the counsel of your companions."
        [/message]
		[kill]
			id=Crelanu
			animate=no
		[/kill]
		[message]
            speaker=narrator
            message= _ "<i>The mage vanishes in a shroud of darkness, never to be seen again.</i>"
            image=wesnoth-icon.png
        [/message]
		[message]
            speaker=Prince Haldric
            message= _ "No, Crelanu, do not leave us, perhaps our mages can heal you!"
			image=portraits/haldric-surprised.webp
        [/message]
		[message]
            speaker=Minister Edren
            message= _ "We are better off without him, my liege. His dark arts were far too nefarious for us to linger in his presence."
        [/message]
    [/event]

	[event]
        name=last breath
        [filter]
            id=Commander Aethyr
        [/filter]
        [message]
            speaker=Commander Aethyr
            message= _ "Let me have peace in Death! My love, I shall be there soon—"
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=Lord Typhon
        [/filter]
        [message]
            speaker=Prince Haldric
            message= _ "Without him the bottoms of our ships will be completely vulnerable..."
            image=portraits/haldric-surprised.webp
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

#enddef
