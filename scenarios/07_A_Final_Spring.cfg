    [/side]

    [side]
        type=Naga Myrmidon
        id=Thisstrix
        name= _ "Thisstrix"
        side=5
        canrecruit=yes
		recruit=Naga Fighter,Naga Dirkfang,Naga Ophidian
        {GOLD 150 200 250}
        team_name=orcs
        user_team_name=_"Orcs"
        [ai]
            {NO_SCOUTS}
            recruitment_pattern=fighter,fighter,scout
        [/ai]
        [ai]
            time_of_day=dusk,first_watch,second_watch
            aggression=0.75
            caution=0.0
            grouping=no
        [/ai]
        {INCOME 2 3 4}
    [/side]

    [side]
        side=6
        no_leader=yes
        team_name=orcs
        hidden=yes
        [ai]
            village_value=0
        [/ai]
    [/side]

    [event]
        name=prestart

        [item]
            x,y=3,18
            image=scenery/lighthouse.png
            halo=halo/lighthouse-aura.png
        [/item]

        # Time Area for the lighthouse, simulating illumination
        [time_area]
            x,y=3,18
            radius=2
            id=lighthouse
            # Schedule using the red, green, blue values from other ToDs,
            # but overriding the image to fit the current ToD, and applying a bonus.
            {MORNING} # (actually dawn)
            [+time]
                image=misc/time-schedules/default/schedule-dawn.png~BLIT(misc/tod-bright.png)
                lawful_bonus=25
            [/time]
            {MORNING}
            {AFTERNOON}
            {AFTERNOON} # (actually dusk)
            [+time]
                image=misc/time-schedules/default/schedule-dusk.png~BLIT(misc/tod-bright.png)
                lawful_bonus=25
            [/time]
            {DAWN} # (actually 1st night)
            [+time]
                image=misc/time-schedules/default/schedule-firstwatch.png~BLIT(misc/tod-bright.png)
                lawful_bonus=0
            [/time]
            {DAWN} # (actually 2nd night)
            [+time]
                image=misc/time-schedules/default/schedule-secondwatch.png~BLIT(misc/tod-bright.png)
                lawful_bonus=0
            [/time]
        [/time_area]

        {PLACE_IMAGE ("units/transport/transport-galleon.png~RC(magenta>blue)") 20 22}
        {PLACE_IMAGE ("units/transport/galleon.png~RC(magenta>blue)") 21 25}
        {PLACE_IMAGE (scenery/trapdoor-closed.png) 16 30}
        {PLACE_IMAGE (scenery/signpost.png) 24 24}
        {PLACE_IMAGE (scenery/signpost.png) 30 44}
        {PLACE_IMAGE (scenery/signpost.png) 41 32}
        {PLACE_IMAGE (scenery/signpost.png) 16 4}
        {PLACE_IMAGE (scenery/signpost.png) 39 11}
        {PLACE_IMAGE (scenery/signpost.png) 18 17}

        [recall]
            id=Lady Jessene
        [/recall]
        [recall]
            id=Tromas
        [/recall]
        [recall]
            id=Burin the Lost
        [/recall]
        [recall]
            id=Minister Edren
        [/recall]
        [recall]
            id=Sir Ladoc
        [/recall]
        [recall]
            id=Crelanu
        [/recall]

        [object]
            id=ruby_of_fire
            description= _ "The Ruby of Fire was imbued with magic in the distant west, and can be used to scorch enemies into submission."
            silent=yes
            duration=forever
            [filter]
                id=Prince Haldric
            [/filter]
            [effect]
                apply_to=new_attack
                name=ruby of fire
                description= _ "ruby of fire"
                icon=attacks/fireball.png
                type=fire
                range=ranged
                [specials]
                    {WEAPON_SPECIAL_MAGICAL}
                [/specials]
                damage=14
                number=4
            [/effect]

            [effect]
                apply_to=new_animation
                [attack_anim]
                    [filter_attack]
                        name=ruby of fire
                    [/filter_attack]

                    {MISSILE_FRAME_FIREBALL_XY 0 0}
                    start_time=-200
                    [frame]
                        sound=fire.wav
                    [/frame]
                [/attack_anim]
            [/effect]
        [/object]

        [objectives]
            side=1
            [objective]
                description= _ "Survive until the end of turns"
                condition=win
				show_turn_counter=yes
            [/objective]
            [objective]
                description= _ "Death of Prince Haldric"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Lady Jessene"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of King Addroran IX"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Lord Typhon"
                condition=lose
                [show_if]
                    [have_unit]
                        # wmllint: recognize Lord Typhon
                        id=Lord Typhon
                    [/have_unit]
                [/show_if]
            [/objective]
			[objective]
                description= _ "Death of Commander Aethyr"
                condition=lose
                [show_if]
                    [have_unit]
                        id=Commander Aethyr
                    [/have_unit]
                [/show_if]
            [/objective]
            [gold_carryover]
                bonus=no
                carryover_percentage=0
            [/gold_carryover]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=narrator
            message= _ "Several months pass. Jessene has translated Lich-Lord Caror’s Book of Fire and Darkness. Prince Haldric is busy probing the secrets of the Ruby of Fire."
            image=wesnoth-icon.png
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "I think I’ve figured something out. Look."
            image=portraits/haldric-annoyed.webp
        [/message]

        [animate_unit]
            [filter]
                id=Prince Haldric
            [/filter]

            [facing]
                x,y=12,28
            [/facing]

            flag=attack

            [primary_attack]
                name=ruby of fire
            [/primary_attack]

            hits=yes
        [/animate_unit]

        [message]
            speaker=Prince Haldric
            message= _ "Ouch! Hot, hot, hot! Gee, somebody should really attach this thing to a scepter or something! I think I’ll save it for closer-ranged combat for now."
            image=portraits/haldric-mad.webp
        [/message]
        [message]
            speaker=Lady Jessene
            message= _ "Watch it! Well, at least you’re improving."
        [/message]
		[message]
            speaker=Crelanu
            message= _ "Without a focus to shield you, the Ruby's radiance will do more than burn your hands— it will sear your very spirit."
        [/message]
        [message]
            speaker=Burin the Lost
            message= _ "Humph. Fool of a boy’s just gonna burn us all up. Humans, always playing at being wizards."
            image=portraits/burin-annoyed.webp
        [/message]
        [message]
            speaker=Southbay Guard 1
            message= _ "Orcs sighted! They’ve seized the frontier! To arms! To arms!"
        [/message]
        [message]
            speaker=Sir Ladoc
            message= _ "For the glory of Southbay!"
        [/message]
        [message]
            speaker=King Addroran IX
            message= _ "Prince Haldric, I shall concentrate on holding Southbay. You must defeat the orcs. The ships are not ready yet. We must defeat this army of orcs to buy us more time. Try not to kill us all with that ruby!"
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "Very well. I’ll do my best."
        [/message]
    [/event]

