#textdomain wesnoth-trow
[scenario]
    id=09b_Troll_Hole
    name= _ "Troll Hole"
    next_scenario=09x_The_Kalian
    map_file=09b_Troll_Hole.map

    {TURNS 33 30 27}
    {UNDERGROUND}

    {SCENARIO_MUSIC underground.ogg}

    # No story
    {TROW_GC_TRACK {JOURNEY_09B_NEW} }

    {TROW_DEATHS}

    [side]
        type=Noble Commander
        id=Prince Haldric
        name= _ "Prince Haldric"
        unrenamable=yes
        side=1
        canrecruit=yes
        {GOLD 210 180 150}
        controller=human
        shroud=yes
        team_name=Haldric
        user_team_name=_"Refugees"
        {INCOME 7 5 3}
        {FLAG_VARIANT loyalist}
    [/side]

    [side]
        type=Troll Warrior
        id=Erart
        name= _ "Erart"
        side=2
        canrecruit=yes
        {GOLD 90 120 150}
        {INCOME 0 2 4}
        team_name=Troll
        user_team_name=_"Trolls"
        recruit=Troll Whelp,Troll,Troll Rocklobber
        [ai]
            {NO_SCOUTS}
            recruitment_pattern=fighter,fighter,mixed fighter
            aggression={ON_DIFFICULTY 0.69 0.72 0.75}
        [/ai]
    [/side]

    {STARTING_VILLAGES 2 {ON_DIFFICULTY 8 9 10}}

    [side]
        type=Troll Warrior
        id=Raol
        name= _ "Raol"
        side=3
        canrecruit=yes
        {GOLD 90 120 150}
        {INCOME 0 2 4}
        team_name=Troll
        user_team_name=_"Trolls"
        recruit=Troll Whelp,Troll,Troll Rocklobber
        [ai]
            {NO_SCOUTS}
            recruitment_pattern=fighter,fighter,mixed fighter
            aggression={ON_DIFFICULTY 0.69 0.72 0.75}
        [/ai]
    [/side]

    {STARTING_VILLAGES 3 {ON_DIFFICULTY 8 9 10}}

    [side]
        type=Troll Warrior
        id=Rilg
        name= _ "Rilg"
        side=4
        canrecruit=yes
        {GOLD 80 140 200}
        {INCOME 2 5 8}
        team_name=Troll
        user_team_name=_"Trolls"
        recruit=Troll Whelp,Troll,Troll Rocklobber
        [ai]
            {NO_SCOUTS}
            recruitment_pattern=fighter,fighter,mixed fighter
            aggression={ON_DIFFICULTY 0.69 0.72 0.75}
        [/ai]
    [/side]

    {STARTING_VILLAGES 4 {ON_DIFFICULTY 8 9 10}}

    [side]
        type=Troll Warrior
        id=Gulg
        name= _ "Gulg"
        side=5
        canrecruit=yes
        {GOLD 80 140 200}
        {INCOME 2 5 8}
        team_name=Troll
        user_team_name=_"Trolls"
        recruit=Troll Whelp,Troll,Troll Rocklobber
        [ai]
            {NO_SCOUTS}
            recruitment_pattern=fighter,fighter,mixed fighter
            aggression={ON_DIFFICULTY 0.69 0.72 0.75}
        [/ai]
    [/side]

    {STARTING_VILLAGES 5 {ON_DIFFICULTY 8 9 10}}

    {LIMIT_CONTEMPORANEOUS_RECRUITS 2,3,4,5 "Troll" {ON_DIFFICULTY 1 2 3}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2,3,4,5 "Troll Rocklobber" {ON_DIFFICULTY 1 2 3}}

    {campaigns/The_Rise_Of_Wesnoth/utils/trow-nlmsg.cfg}

    [event]
        name=prestart

        {PLACE_IMAGE (scenery/rubble.png) 3 14}
        {PLACE_IMAGE (scenery/rubble.png) 25 19}
        {PLACE_IMAGE (scenery/rubble.png) 15 3}
        {PLACE_IMAGE (scenery/rubble.png) 17 27}

		{LOYAL_UNIT 2 (Kraken) 16 2} {GUARDIAN}
        {LOYAL_UNIT 2 (Tentacle of the Deep) 15 11}
        {LOYAL_UNIT 3 (Tentacle of the Deep) 14 19}

#ifdef NORMAL
        {LOYAL_UNIT 4 (Tentacle of the Deep) 11 15}
        {LOYAL_UNIT 5 (Tentacle of the Deep) 19 17}
#endif

#ifdef HARD
        {LOYAL_UNIT 4 (Tentacle of the Deep) 11 15}
        {LOYAL_UNIT 5 (Tentacle of the Deep) 19 17}
        {LOYAL_UNIT 2 (Tentacle of the Deep) 11 17}
        {LOYAL_UNIT 3 (Tentacle of the Deep) 19 15}
#endif

        {RANDOM 1..4}
        [if]
            [variable]
                name=random
                numerical_equals=1
            [/variable]
            [then]
                [kill]
                    id=Erart
                [/kill]
                {GUARD_UNIT (Giant Spider) () ( _ "Fang") 3 5 5}
                [kill]
                    id=Raol
                [/kill]
                {GUARD_UNIT (Giant Spider) () ( _ "Fang") 2 25 5}
            [/then]
        [/if]
        [if]
            [variable]
                name=random
                numerical_equals=2
            [/variable]
            [then]
                [kill]
                    id=Raol
                [/kill]
                {GUARD_UNIT (Shadow Jumping Spider) () ( _ "") 2 25 5}
                [kill]
                    id=Rilg
                [/kill]
                {GUARD_UNIT (Giant Spider) () ( _ "") 5 5 25}
            [/then]
        [/if]
        [if]
            [variable]
                name=random
                numerical_equals=3
            [/variable]
            [then]
                [kill]
                    id=Rilg
                [/kill]
                {GUARD_UNIT (Shadow Jumping Spider) () ( _ "") 5 5 25}
                [kill]
                    id=Gulg
                [/kill]
                {GUARD_UNIT (Giant Spider) () ( _ "") 4 25 25}
            [/then]
        [/if]
        [if]
            [variable]
                name=random
                numerical_equals=4
            [/variable]
            [then]
                [kill]
                    id=Gulg
                [/kill]
                {GUARD_UNIT (Shadow Jumping Spider) () ( _ "") 4 25 25}
                [kill]
                    id=Erart
                [/kill]
                {GUARD_UNIT (Giant Spider) () ( _ "") 3 5 5}
            [/then]
        [/if]

        [recall]
            id=Lady Jessene
        [/recall]
		[recall]
            id=Commander Aethyr
        [/recall]
        [recall]
            id=Tromas
        [/recall]
        [recall]
            id=Burin the Lost
        [/recall]
        [recall]
            id=Minister Edren
        [/recall]
        [recall]
            id=Sir Ladoc
        [/recall]
        [recall]
            id=Crelanu
        [/recall]

        [objectives]
            side=1
            [objective]
                description= _ "Defeat all enemy leaders"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Prince Haldric"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Lady Jessene"
                condition=lose
            [/objective]

            {TURNS_RUN_OUT}

            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=narrator
            message= _ "It isn’t long before Haldric and his companions enter the Brown Hills. An elven guide leads them to a gaping cave mouth, and they descend into the darkness."
            image=wesnoth-icon.png
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "Does anyone know anything about these Trolls?"
        [/message]
        [message]
            speaker=Burin the Lost
            message= _ "I indeed do. They are ugly and mean, and will try to crush you like a bug. They heal very quickly."
        [/message]
        [message]
            speaker=Lady Jessene
            message= _ "Hmm... Do we really need to know that much about the trolls? I think it’s safe to say that the elves wouldn’t have sent us down here if they were at all friendly."
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "Fair enough. Well, let’s get them!"
            image=portraits/haldric-mad.webp
        [/message]

		[modify_unit]
			[filter]
				type=Tentacle of the Deep
			[/filter]
			invulnerable=yes
		[/modify_unit]
    [/event]

	[event]
        name=attack end
        [filter]
            side=1
        [/filter]
        [filter_second]
            type=Tentacle of the Deep
        [/filter_second]

		[message]
            speaker=unit
            message= _ "These creatures seem to evade all my attacks. What sorcery is this!"
        [/message]
		[message]
            speaker=Minister Edren
            message= _ "The darkness always broods foul sorcery. It must have a source somewhere."
        [/message]
	[/event]

	[event]
		name=die
		[filter]
			type=Kraken
		[/filter]

		[modify_unit]
			[filter]
				type=Tentacle of the Deep
			[/filter]
			invulnerable=no
		[/modify_unit]

		[message]
            speaker=Lady Jessene
            message= _ "I have a feeling those annoying tentacles will take our hits much more seriously now."
        [/message]
		[message]
            speaker=Crelanu
            message= _ "Indeed. Those creatures may have been extensions of the Kraken's will. This kind of sorcery is most unexpected..."
        [/message]
	[/event]

    [event]
        name=time over
        [message]
            speaker=Prince Haldric
            message= _ "We have failed... More of the trolls’ kin are arriving through the entrance!"
            image=portraits/haldric-surprised.webp
        [/message]
    [/event]

    [event]
        name=die
        [filter]
            id=Erart
        [/filter]
        {LOOT {ON_DIFFICULTY 70 60 50} 1}
    [/event]

    [event]
        name=die
        [filter]
            id=Raol
        [/filter]
        {LOOT {ON_DIFFICULTY 70 60 50} 1}
    [/event]

    [event]
        name=die
        [filter]
            id=Rilg
        [/filter]
        {LOOT {ON_DIFFICULTY 70 60 50} 1}
    [/event]

    [event]
        name=die
        [filter]
            id=Gulg
        [/filter]
        {LOOT {ON_DIFFICULTY 70 60 50} 1}
    [/event]

    [event]
        name=enemies defeated
        [message]
            speaker=Prince Haldric
            message= _ "The trolls are beaten, but they were no easy opponents. It is no wonder why the elves pressed us to do their dirty work."
        [/message]

        {VARIABLE_OP num_done add 1}

        [set_variable]
            name=troll_hole
            value=1
        [/set_variable]

        [set_variable]
            name=last_done
            value="Hole"
        [/set_variable]

        {CLEAR_VARIABLE random}

        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]
[/scenario]
