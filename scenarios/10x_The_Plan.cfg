#textdomain wesnoth-trow
[scenario]
    id=10x_The_Plan
    name= _ "The Plan"
    next_scenario=10_The_Rise_of_Wesnoth
    map_file=10x_The_Plan.map
    turns=1
    theme=Cutscene_Minimal

    {AFTERNOON}

    {SCENARIO_MUSIC revelation.ogg}

    # No story
    {TROW_GC_TRACK {JOURNEY_10X_NEW} }

    [side]
        side=1
        type=Noble Commander
        id=Prince Haldric
        name= _ "Prince Haldric"
        unrenamable=yes
        canrecruit=yes
        gold=0
        controller=human
        team_name=Haldric
        user_team_name=_"Refugees"
        {FLAG_VARIANT loyalist}
    [/side]

    [event]
        name=prestart

        # Jessene is always present by this point.
        [recall]
            id=Lady Jessene
        [/recall]

        [if]
            [have_unit]
                id=Lady Jessene
            [/have_unit]
            [then]
                # This is a safety thing, in case you managed to beat the prior
                # scenario before Jessene got back (impossible).
            [/then]
            [else]
                [set_variable]
                    name=jessica_store.x
                    value=8
                [/set_variable]
                [set_variable]
                    name=jessica_store.y
                    value=5
                [/set_variable]

                [unstore_unit]
                    variable=jessica_store
                    find_vacant=yes
                [/unstore_unit]

                {CLEAR_VARIABLE jessica_store}
            [/else]
        [/if]

        [recall]
            id=Commander Aethyr
        [/recall]
        [recall]
            id=Tromas
        [/recall]
        [recall]
            id=Burin the Lost
        [/recall]
        [recall]
            id=Minister Edren
        [/recall]
        [recall]
            id=Sir Ladoc
        [/recall]
        [recall]
            id=Crelanu
        [/recall]
        [teleport]
            [filter]
                id=Prince Haldric
            [/filter]
            x=11
            y=7
        [/teleport]
        [teleport]
            [filter]
                id=Lady Jessene
            [/filter]
            x=8
            y=5
        [/teleport]
        [teleport]
            [filter]
                id=Commander Aethyr
            [/filter]
            x=14
            y=10
        [/teleport]

        [hide_unit]
            x=14
            y=10
        [/hide_unit]
        [teleport]
            [filter]
                id=Tromas
            [/filter]
            x=10
            y=8
        [/teleport]
        [teleport]
            [filter]
                id=Burin the Lost
            [/filter]
            x=12
            y=8
        [/teleport]
        [teleport]
            [filter]
                id=Minister Edren
            [/filter]
            x=9
            y=7
        [/teleport]
        [teleport]
            [filter]
                id=Sir Ladoc
            [/filter]
            x=9
            y=7
        [/teleport]
        [teleport]
            [filter]
                id=Crelanu
            [/filter]
            x=13
            y=7
        [/teleport]
    [/event]

    [event]
        name=start

        [scroll_to_unit]
            id=Prince Haldric
            x=11
            y=7
        [/scroll_to_unit]

        [delay]
            time=1250
        [/delay]

        # Jessene reports what she learned at the Ka'lian rather than having
        # the player watch the spying itself.
        [message]
            speaker=Lady Jessene
            message= _ "Haldric, I have news from the Ka'lian. I stayed behind after the others departed and listened to the council."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "What did you learn?"
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "The elves know that Jevyan is likely to return. They are preparing for another war, but they do not know when it will come or how great his forces will be."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "More importantly, they believe our pact with them means that we will stand beside them if the orcs return. They are counting on us."
        [/message]

        [message]
            speaker=Minister Edren
            message= _ "Then they are fools. We have barely enough strength to defend ourselves."
        [/message]

        [message]
            speaker=Sir Ladoc
            message= _ "We gave our word to the elves. A pact is worth little if it is abandoned the moment it becomes inconvenient."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "I agree. But a pact will not matter if our people are dead."
        [/message]

        [message]
            speaker=Burin the Lost
            message= _ "If Jevyan comes with those wretched hordes of skeletons and orcs, we'll be crushed trying to fight everyone at once."
        [/message]

        [message]
            speaker=Tromas
            message= _ "Then we must make sure that he does not come for us first."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "I know Haldric has been thinking about this. And I think I know what he has in mind."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "We are going to convince Jevyan that we gave the elves the Ruby of Fire in exchange for our place in this new land."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "So Jevyan will believe that the elves possess it."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "Yes. If the orcs learn that the elves have the Ruby, they will have every reason to turn their attention toward them first."
        [/message]

        [message]
            speaker=Minister Edren
            message= _ "And while the elves and orcs tear each other apart, we might have a chance to survive."
        [/message]

        [message]
            speaker=Sir Ladoc
            message= _ "You would deceive both our allies and our enemies."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "I would deceive an enemy who intends to destroy us and protect a people who may otherwise be forced to bear the first blow. I do not relish it, but survival must come first."
        [/message]

        [message]
            speaker=Crelanu
            message= _ "Jevyan is ambitious, but ambition has made him suspicious as well. If he believes the Ruby has fallen into the hands of the elves, he will not simply dismiss the possibility."
        [/message]

        [message]
            speaker=Tromas
            message= _ "The difficulty is making him believe the lie."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "That is why the treaty must be convincing. Jessene, you are going to forge a very official-looking document in which we give the elves the Ruby of Fire in return for our place here."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "Haldric, that's devious. I kind of like it."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "But there is still a problem. If the elves believe we have honored our pact, they will expect us to come to their aid."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "Yes. And we may come to their aid. We will have to weigh our options when the time comes."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "If the orcs return in great numbers, the brunt of their assault must fall on somebody else or we will not survive it."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "Many people would call you a coward if you refused to help them. They would say that you turned your back on your pact with the elves."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "Recent events have taught me one thing: survival trumps honor."
            image=portraits/haldric-annoyed.webp
        [/message]

        [message]
            speaker=Burin the Lost
            message= _ "And how exactly do you intend to make Jevyan believe this treaty is genuine?"
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "I'm going to face Jevyan myself."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "Haldric..."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "If the rumors of his power are true, he will take the treaty from my corpse. Then, after word of the treaty has spread to the orcs, you will destroy Jevyan before he has a chance to learn the truth from my undead mind."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "<i>What?!</i>"
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "Haldric! I won't do it. I won't help. What is it with your kind, always rushing to a fool's death? Who will lead these people? I... <i>we</i> need you alive."
        [/message]

        [message]
            speaker=Tromas
            message= _ "She is right, sir. Your death would leave these people without their leader at the moment they need one most."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "You will. I wouldn't have made it this far without Jessene, or any of you. But everything turns on convincing Jevyan. It is the only way we can possibly keep the orc hordes off our necks."
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "There is no way I'm letting you go through with this, sir! Over my dead body, right Jessene?"
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "Right!"
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "Then let me do it."
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "No. I can't ask you to do this."
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "You have denied me an honorable death twice already. Once when you arrived at Clearwater Port, and once again when you rescued me at Southbay. I will not be denied a third time!"
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "No, Aethyr. This is my sacrifice to make."
            image=portraits/haldric-mad.webp
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "Sir, my family has been slaughtered, and my home lost. All I long for is to join them."
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "After this conflict is over I will have to suffer through the long years alone, with no honorable way of joining them. I want to look that monster Jevyan in the eye before I go! I will not be denied!"
        [/message]

        [message]
            speaker=Sir Ladoc
            message= _ "Commander..."
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "Give me this honorable death. Please, Sir. I beg you!"
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "Very well, if you cannot be deterred. But remember: you <i>must</i> be slain by Jevyan himself. We cannot have an illiterate orc or mindless skeleton taking the treaty. We will honor your sacrifice."
        [/message]

        [message]
            speaker=Commander Aethyr
            message= _ "Honor me by destroying Jevyan! Preferably before he can do unnatural things to me. I want to rest in the ground, not become some mindless undead slave for all eternity!"
        [/message]

        [message]
            speaker=Prince Haldric
            message= _ "We shall make sure. I promise."
        [/message]

        [message]
            speaker=Lady Jessene
            message= _ "We'll have to be careful to let one of the orcish leaders escape back to the Green Isle with the knowledge that the elves 'have' the Ruby of Fire."
        [/message]

        [message]
            speaker=Lady Jessene
			# wmllint: local spelling Sheesh
            message= _ "Sheesh... What is your kind's infatuation with rushing to an 'honorable death'?"
        [/message]

        [endlevel]
            result=victory
            bonus=no
            {NEW_GOLD_CARRYOVER 100}
            next_scenario=10_The_Rise_of_Wesnoth
            carryover_report=no
            linger_mode=no
            replay_save=no
        [/endlevel]
    [/event]
[/scenario]