#textdomain wesnoth-trow
[scenario]
    id=08_Peoples_in_Decline
    name= _ "Peoples in Decline"
    next_scenario=
    map_file=08_Peoples_in_Decline.map
    {TURNS 30 30 25}
    {DEFAULT_SCHEDULE}

    {SCENARIO_MUSIC knalgan_theme.ogg}
    {EXTRA_SCENARIO_MUSIC wanderer.ogg}

    [story]
        [part]
            music=underground.ogg
            story= _ "Several days later Prince Haldric departs in his ship, the Eldaric, his home and the Green Isle lost to him forever. Before him lay a vast expanse of stormy seas, and the mysterious island that Lady Jessene has mentioned, and even more exotic lands even further to the East."
        [/part]

        [part]
            story= _ "The island that King Haldric and his crew are approaching was at one time a volcano that is now slowly sinking into the sea. The elder Crown Prince of Southbay had managed to establish a foothold on this Island, despite the belligerent nature of its reptilian inhabitants. There will be little left of that foothold by now."
            background=story/trow_story_13-Peoples_in_Decline.webp
        [/part]
    [/story]

    {TROW_GI_TRACK {JOURNEY_08_NEW} }

    {TROW_DEATHS}

    [side]
        type=Noble Commander
        id=Prince Haldric
        name= _ "Prince Haldric"
        unrenamable=yes
        side=1
        canrecruit=yes
        {GOLD 200 175 150}
        controller=human
        team_name=Haldric
        user_team_name=_"Refugees"
        {FLAG_VARIANT loyalist}
    [/side]

    [side]
        type=Hurricane Drake
        id=Kegrid
        name= _ "Kegrid"
        side=2
        canrecruit=yes
        {GOLD 75 100 125}
        {INCOME 3 3 8}
        team_name=Drake
        user_team_name=_"Drakes"
#ifdef EASY
        recruit=Drake Burner,Drake Clasher,Drake Glider,Drake Fighter
#else
        recruit=Drake Burner,Drake Clasher,Drake Glider,Fire Drake,Drake Arbiter,Drake Fighter,Drake Warrior
#endif
        [ai]
            {NO_SCOUTS}
            recruitment_pattern=scout,fighter,fighter,archer,fighter
            aggression=0.75
        [/ai]
    [/side]

    [side]
        type=Drake Flameheart
        id=Gerrick
        name= _ "Gerrick"
        side=3
        canrecruit=yes
        {GOLD 75 100 125}
        {INCOME 3 3 8}
        team_name=Drake
        user_team_name=_"Drakes"

#ifdef EASY
        recruit=Drake Burner,Drake Clasher,Drake Glider,Drake Fighter
#else
        recruit=Drake Burner,Drake Clasher,Drake Glider,Fire Drake,Drake Flare,Drake Fighter,Drake Warrior
#endif

        [ai]
            {NO_SCOUTS}
#ifdef EASY
            recruitment_pattern=scout,fighter,fighter,archer,fighter
#else
            recruitment_pattern=scout,fighter,fighter,archer,fighter,mixed fighter
#endif
            aggression=0.75
        [/ai]
    [/side]

    [side]
        type=Hurricane Drake
        id=Merkush
        name= _ "Merkush"
        side=4
        canrecruit=yes
        {GOLD 70 100 125}
        {INCOME 3 3 8}
        team_name=Drake
        user_team_name=_"Drakes"

#ifdef EASY
        recruit=Drake Burner,Drake Clasher,Drake Glider,Drake Fighter
#else
        recruit=Drake Burner,Drake Clasher,Drake Glider,Fire Drake,Drake Thrasher,Drake Fighter,Drake Warrior
#endif

        [ai]
            {NO_SCOUTS}
            recruitment_pattern=scout,fighter,fighter,archer,fighter
            aggression=0.75
        [/ai]
    [/side]

    [side]
        side=5
        no_leader=yes
        team_name=Drake
        hidden=yes
        [ai]
            village_value=0
        [/ai]
    [/side]

    [event]
        name=prestart
        {OBJ_TRIDENT_STORM 17 18 (trident)}

        [recall]
            id=Lady Jessene
        [/recall]
		[recall]
            id=Commander Aethyr
        [/recall]
        [recall]
            id=Tromas
        [/recall]
        [recall]
            id=Burin the Lost
        [/recall]
        [recall]
            id=Minister Edren
        [/recall]
        [recall]
            id=Sir Ladoc
        [/recall]
        [recall]
            id=Crelanu
        [/recall]
        [recall]
            id=Lord Typhon
            x,y=9,9
        [/recall]

        {PLACE_IMAGE ("units/transport/galleon.png~RC(magenta>red)") 10 9}

        [objectives]
            side=1
            [objective]
                description= _ "Defeat Gerrick"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Prince Haldric"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Lady Jessene"
                condition=lose
            [/objective]
			[objective]
                description= _ "Commander Aethyr"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Lord Typhon"
                condition=lose
            [/objective]

            {TURNS_RUN_OUT}

            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            speaker=narrator
            message= _ "After some time at sea an island is spotted. The <i>Eldaric</i> docks at a crude port that appears to be deserted."
            image=wesnoth-icon.png
        [/message]
        [message]
            speaker=Burin the Lost
            message= _ "Land! Land! Bless the Lords of Light!"
        [/message]
        [message]
            speaker=Lady Jessene
            message= _ "This is the Elder Prince’s island all right. We had a heck of a time pacifying the drakes who live here. Oh my, it looks like they’ve rearmed!"
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "We come in peace. We only seek to re-provision our ships."
        [/message]
        [message]
            speaker=Gerrick
            message= _ "So humans, you have come to trouble us again. Prepare to die! As Dominant of this Flight, I will not allow you to pillage our lands."
        [/message]
		[message]
            speaker=Edren
            message= _ "More winged heathens. It seems every corner of this world is infested with creatures that have no respect for the Light or the Crown."
        [/message]
		[message]
            speaker=Sir Ladoc
            message= _ "Whether in the air or the ground, my steed and I shall slay them all!"
        [/message]
		[message]
            speaker=Crelanu
            message= _ "They are a civilization being swallowed by the sea. The Drakes see a fleet of warships arriving and assume—rightly—that we are here to take what little dry land they have left."
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "I care little for their history or their sinking island. We need supplies. If they won't trade, then the Ruby will clear the path. I will not let my people starve at sea because a few lizards are 'belligerent."
        [/message]
		[message]
			speaker=Lady Jessene
            message= _ "You're getting more surly by the day. There has to be a way to... dampen that gem's influence."
        [/message]
		[message]
            speaker=Tromas
            message= _ "Be wary, Prince Haldric. This could be a bloodbath if not handled with caution."
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            side=1
            x=17
            y=18
        [/filter]

        [event]
            name=new turn

            {VARIABLE_OP xx1 rand "18..19"}
            {VARIABLE_OP yy1 rand "16..19"}

            {NAMED_LOYAL_UNIT 5 (Sea Serpent) $xx1 $yy1 (Bitey the Serpent) ( _ "Bitey the Serpent")}

            [message]
                side=1
                [filter_location]
                    x,y=$xx1,$yy1
                    radius=10
                [/filter_location]
                message= _ "Look out, a serpent has emerged from the deep!"
            [/message]

            [scroll_to_unit]
                id=Bitey the Serpent
            [/scroll_to_unit]

            {CLEAR_VARIABLE xx1,yy1}
        [/event]
    [/event]

	[event]
		name=last breath

		[filter]
			id=Gerrick
		[/filter]

		[message]
			speaker=Gerrick
			message= _ "Hold! Your fire... it is not the clumsy flame of a hatchling. You fight with the precision of a Dominant."
		[/message]
		[message]
			speaker=Prince Haldric
			image=portraits/haldric-annoyed.webp
			message= _ "I told you we only came for supplies. My patience is as thin as the land you stand on. Do we continue this, or do we eat?"
		[/message]
		[message]
			speaker=Crelanu
			message= _ "The Prince speaks with the Ruby's tongue, Gerrick. He is a 'Dominant' of a different sort now. Do not force him to prove it further; he is becoming quite fond of the demonstration."
		[/message]
		[message]
			speaker=Gerrick
			message= _ "Hmph. If you have the strength to best a Flight leader, you have the right to take what you need. We shall not waste more blood on a sinking rock. Provision your ships and begone—before the tides claim us both."
		[/message]
		[message]
			speaker=Lady Jessene
			message= _ "Well handled, Haldric. Though I prefered it when you used your wit to win, rather than just... scaring them with your eyes."
		[/message]
		[message]
			speaker=Prince Haldric
			message= _ "Results are all that matter, Jessene. Everyone, gather the supplies. We sail for the Great Continent within the hour."
		[/message]

		[heal_unit]
			[filter]
				id=Gerrick
			[/filter]
			amount=1
		[/heal_unit]

        [message]
            speaker=Lady Jessene
            message= _ "The nice thing is, they’ll go back to guarding this island after we’re gone for a while. It’ll make a good way of preventing others from following us."
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "This island is slowly sinking. Hmm, I wonder what they’ll do when it gets too small for them?"
        [/message]
        [message]
            speaker=Lady Jessene
            message= _ "They seem rather intelligent. They’re certainly belligerent and numerous. I’m sure they’ll eventually evacuate. Just like us right now."
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "I don’t find that thought very comforting."
        [/message]

		[move_unit_fake]
            type=Familiar
            side=4
            x=3,3,4
            y=1,2,2
        [/move_unit_fake]

        {LIVING_INTEL (Familiar) (Familiar) ( _ "Familiar") "portraits/familiar.webp" 4 4 2}
        # wmllint: directory spelling Neep
        [message]
            speaker=Familiar
            message= _ "<i>Clack</i>! <i>Clack!</i>"
        [/message]

        [kill]
            id=Familiar
        [/kill]

        [move_unit_fake]
            type=Familiar
            side=4
            x=4,3,2,1
            y=2,3,2,2
        [/move_unit_fake]

		[endlevel]
			result=victory
			bonus=yes
			{NEW_GOLD_CARRYOVER 40}
		[/endlevel]
	[/event]

    [event]
        name=time over
        [message]
            speaker=Lady Jessene
            message= _ "The fleet is starving, we’ll never pacify this island before we all die!"
        [/message]
    [/event]
[/scenario]