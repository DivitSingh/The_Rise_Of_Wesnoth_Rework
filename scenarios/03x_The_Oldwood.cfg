#textdomain wesnoth-trow
[scenario]
    id=03x_The_Oldwood
    name= _ "The Oldwood"
    next_scenario=04_Temple_in_the_Deep
    map_file=03x_The_Oldwood.map
    victory_when_enemies_defeated=no
    {DEFAULT_SCHEDULE}
    {SCENARIO_MUSIC suspense.ogg}
    {EXTRA_SCENARIO_MUSIC nunc_dimittis.ogg}
    {TROW_GI_TRACK {JOURNEY_03X_NEW} }
    {TROW_DEATHS}

    [side]
        type=Noble Commander
        id=Prince Haldric
        name= _ "Prince Haldric"
        unrenamable=yes
        side=1
        gold=0
        canrecruit=yes
        controller=human
        team_name=Haldric
        user_team_name=_"Refugees"
        {FLAG_VARIANT loyalist}
    [/side]

    [side]
        side=2
        type=Shadow Lord
        id=Crelanu
        name= _ "Crelanu"
		profile=portraits/crelanu.webp
        canrecruit=yes
        team_name=Haldric
        user_team_name=_"Shadow Magi"
        [modifications]
            {TRAIT_DEXTROUS}
        [/modifications]
    [/side]

    [event]
        name=prestart
        {CLEAR_VARIABLE last_done,escape_choice}
        {PLACE_IMAGE (scenery/temple1.png) 19 10}
        {PLACE_IMAGE (scenery/castle-ruins3.png) 15 6}
        {PLACE_IMAGE (scenery/castle-ruins.png) 15 7}
        {PLACE_IMAGE (scenery/castle-ruins2.png) 17 6}
        {PLACE_IMAGE (scenery/castle-ruins3.png) 17 7}
        {PLACE_IMAGE (scenery/circle-magic.png) 16 6}
        [recall]
            id=Lady Outlaw
        [/recall]
        [recall]
            id=Tromas
        [/recall]
        [recall]
            id=Burin the Lost
        [/recall]
        [recall]
            id=Minister Edren
        [/recall]
        [recall]
            id=Sir Ladoc
        [/recall]
    [/event]

    [event]
        name=start
        [message]
            speaker=narrator
            message= _ "Haldric’s band finds itself at the heart of the Oldwood Forest. The road quickly narrows and becomes little more than a path. Branches reach high overhead, blocking almost all of the light... The ominous noises of the deep woods echo all around."
            image=wesnoth-icon.png
        [/message]
        [message]
            speaker=Burin the Lost
            message= _ "Will this evil forest ever end! There are mosquitoes as big as my fist in here, and these nasty old trees are giving me the creeps."
            image=portraits/burin-annoyed.webp
        [/message]
        [message]
            speaker=Lady Outlaw
            message= _ "This isn’t so bad. Haldric’s kind are such a suspicious lot when it comes to these sorts of things."
        [/message]
        [message]
            speaker=Crelanu
            message= _ "Our location has been compromised. My fellow magi, to arms!"
        [/message]
        [if]
            [variable]
                name=have_lady
                numerical_equals=1
            [/variable]
            [then]
                [message]
                    speaker=Lady Outlaw
                    message= _ "Haldric, wait! This is Crelanu. He was a high advisor in Jevyan's inner circle— a master of the unseen arts, but one who always drew the line at necromancy. If he is here, it means the rift in the Wesfolk leadership is deeper than we thought."
                [/message]
				[message]
                    speaker=Crelanu
                    message= _ "Deep enough to swallow the whole Isle, M'lady. Prince Haldric, I have watched Jevyan trade our people's souls for an Orcish alliance that will only end in ashes. I seek a different path... and I believe you are the only one left with the strength to walk it."
                [/message]
                [message]
                    speaker=Prince Haldric
                    message= _ "I am not completely pleased with this idea, but it would be remiss to ignore the dire situation we face. At this point we need all of the help we can get!"
                [/message]
            [/then]
            [else]
                [message]
                    speaker=Prince Haldric
                    message= _ "A Wesfolk wizard in ebony robes... My father warned me of your kind. You practiced black magic while our kingdoms burned. Why should I not treat you as Jevyan’s spy?"
                    image=portraits/haldric-surprised.webp
                [/message]
                [message]
                    speaker=Tromas
                    message= _ "<span size='small'>Our men are weary after weeks of travel and may not be able to fight with their full strength. It would be best to avoid a conflict.</span>"
                [/message]
                [message]
                    speaker=Crelanu
                    message= _ "Because a spy would have brought a legion of Orcs, not a warning. Jevyan has become a tyrant, Prince. He opened the Western Gates not to save the Wesfolk, but to rule a graveyard. I prefer the living, even if they are as stubborn as you."
                [/message]
                [message]
                    speaker=Prince Haldric
                    message= _ "I heard as much from a previous Wesfolk brigand we had encountered earlier. It appears your leader took on more than he could handle."
                [/message]
            [/else]
        [/if]
        [message]
            speaker=Crelanu
            message= _ "Beneath this forest lies the Temple of the Deep. Within it, your ancestors sealed Lich-Lord Lenvan. He carries the Ruby of Fire—an artifact of terrible power that my people brought from the Old Continent."
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "A Ruby? How can a single gem help us against thousands of Orcs?"
        [/message]
        [message]
            speaker=Crelanu
            message= _ "It is no mere bauble. It is a focus of elemental fury. In the right hands, it could turn the tide. But be warned, Prince: it is a heavy burden. I have studied its lore— it is said the Ruby’s radiance can warp the mind of the unprepared, turning noble intent into surly suspicion."
        [/message]
        [message]
            speaker=Lady Outlaw
            # wmllint: directory spelling Lenvan
            message= _ "Crelanu must mean the Ruby of Fire. It was our most powerful artifact. We brought it with us from the Old Continent, long ago. We thought it was lost in the war with your people, when Lich-Lord Lenvan fell!"
        [/message]
        [message]
            speaker=Minister Edren
            message= _ "I sense a great darkness in this plan. To use a relic of the Wesfolk, taken from a Lich... it is a dangerous gamble, Haldric."
        [/message]
        [message]
            speaker=Prince Haldric
            message= _ "Danger is all we have left, Edren. Crelanu, if this Ruby can save my people from the Orcs, I will take it. Lead the way to the catacombs."
        [/message]
        [if]
            [variable]
                name=have_lady
                numerical_equals=1
            [/variable]
            [then]
                [message]
                    speaker=Lady Outlaw
                    message= _ "Young Prince, while the lich-lords have betrayed us by allying themselves with that orcish scum, unlike Crelanu, I can’t bring myself to fight against one of the greatest leaders of my people."
                [/message]
                [message]
                    speaker=Prince Haldric
                    message= _ "Lady, why would you let those monsters lead your people?"
                [/message]
                [message]
                    speaker=Lady Outlaw
                    message= _ "Haldric, we are an ancient people who lived in a land filled with all manner of man and beast. We needed vision that extended beyond the meager span of human years. The art of necromancy allowed our best and brightest to live forever, and our worst got to serve as mindless slaves."
                [/message]
                [message]
                    speaker=Lady Outlaw
                    message= _ "Other than losing our war in the far West, then our refugee war to your people, and this orc thing, it wasn’t such a bad deal. Lich-Lord Lenvan was one of our greatest leaders. He led our escape to this land. Albeit, after being down in that hole for so long I don’t imagine he’s too happy."
                [/message]
                [message]
                    speaker=Prince Haldric
                    message= _ "Have you considered the possibility that the unholy act of turning your best and brightest into undead is what causes them to fall into darkness?"
                [/message]
                [message]
                    speaker=Lady Outlaw
                    message= _ "We should save the debate for later. I can still be of use to you. I shall scout the road ahead. We need to know if we can make it to Southbay. I’ll return in a few days."
                [/message]
            [/then]
        [/if]
        [endlevel]
            result=victory
            {NEW_GOLD_CARRYOVER 100}
            carryover_report,linger_mode,replay_save=no,no,no
        [/endlevel]
    [/event]

    [event]
        name=victory
        [if]
            [variable]
                name=have_lady
                numerical_equals=1
            [/variable]
            [then]
                [store_unit]
                    [filter]
                        id=Lady Outlaw
                    [/filter]
                    variable=lady_store
                    kill=yes
                [/store_unit]
            [/then]
        [/if]
    [/event]
[/scenario]
